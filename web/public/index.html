<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>스페이스액스키 계약 종료 동기화</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- 로그인 화면 -->
  <div id="loginScreen" class="screen">
    <div class="login-card">
      <div class="logo">
        <div class="logo-icon">S</div>
        <h1>SpaceAxKey</h1>
        <p class="subtitle">계약 종료 자동 동기화</p>
      </div>
      <form id="loginForm">
        <div class="input-group">
          <label for="password">비밀번호</label>
          <input type="password" id="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-full">로그인</button>
        <p id="loginError" class="error-text hidden"></p>
      </form>
    </div>
  </div>

  <!-- 메인 화면 -->
  <div id="mainScreen" class="screen hidden">
    <header>
      <div class="header-inner">
        <div class="header-left">
          <span class="logo-small">S</span>
          <span class="header-title">SpaceAxKey 계약 종료 동기화</span>
        </div>
        <button id="logoutBtn" class="btn btn-ghost">로그아웃</button>
      </div>
    </header>

    <main>
      <!-- Step 1: 시트 URL 입력 -->
      <section class="card" id="step1">
        <div class="card-header">
          <span class="step-badge">1</span>
          <h2>종료 시트 입력</h2>
        </div>
        <div class="card-body">
          <p class="info-text">스페이스액스키에서 제공받은 계약 종료 시트의 URL을 붙여넣으세요.</p>
          <div class="input-group">
            <label for="termSheetUrl">종료 시트 URL</label>
            <input type="url" id="termSheetUrl" placeholder="https://docs.google.com/spreadsheets/d/..." />
          </div>
          <div class="input-group">
            <label for="termWorksheet">워크시트 탭 이름 <span class="optional">(선택)</span></label>
            <input type="text" id="termWorksheet" placeholder="Sheet1 (기본값)" />
          </div>
          <button id="previewBtn" class="btn btn-primary">
            <span class="btn-icon">🔍</span> 미리보기
          </button>
        </div>
      </section>

      <!-- Step 2: 미리보기 결과 -->
      <section class="card hidden" id="step2">
        <div class="card-header">
          <span class="step-badge">2</span>
          <h2>매칭 결과 확인</h2>
        </div>
        <div class="card-body">
          <!-- 요약 -->
          <div id="summaryBox" class="summary-grid"></div>

          <!-- 탭 -->
          <div class="tabs">
            <button class="tab active" data-tab="exact">정확매칭 <span id="exactCount" class="badge">0</span></button>
            <button class="tab" data-tab="fuzzy">유사매칭 <span id="fuzzyCount" class="badge badge-warn">0</span></button>
            <button class="tab" data-tab="unmatched">매칭실패 <span id="unmatchedCount" class="badge badge-danger">0</span></button>
          </div>

          <!-- 결과 테이블 -->
          <div class="table-wrap">
            <table id="resultTable">
              <thead>
                <tr>
                  <th>상태</th>
                  <th>신뢰도</th>
                  <th>종료-지점명</th>
                  <th>종료-계약자명</th>
                  <th>종료-호실</th>
                  <th>종료-만기일</th>
                  <th>정산-지점명</th>
                  <th>정산-계약자명</th>
                  <th>정산-호실</th>
                  <th>상세</th>
                </tr>
              </thead>
              <tbody id="resultBody"></tbody>
            </table>
          </div>

          <div class="action-bar">
            <button id="syncBtn" class="btn btn-danger">
              <span class="btn-icon">⚡</span> 동기화 실행 (배경색 + 취소선 적용)
            </button>
            <p class="warn-text">정산 시트에 직접 서식이 적용됩니다. 미리보기를 꼭 확인해주세요.</p>
          </div>
        </div>
      </section>

      <!-- Step 3: 실행 결과 -->
      <section class="card hidden" id="step3">
        <div class="card-header">
          <span class="step-badge">3</span>
          <h2>동기화 완료</h2>
        </div>
        <div class="card-body">
          <div id="syncResult"></div>
          <button id="resetBtn" class="btn btn-primary" style="margin-top:20px;">
            새로운 시트로 다시 시작
          </button>
        </div>
      </section>
    </main>
  </div>

  <!-- 로딩 오버레이 -->
  <div id="loadingOverlay" class="overlay hidden">
    <div class="spinner"></div>
    <p id="loadingText">처리 중...</p>
  </div>

  <script src="/app.js"></script>
</body>
</html>
